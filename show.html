<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0f17" />
  <title>FELIZ AÑO NUEVO</title>
  <link rel="stylesheet" href="./styles.css?v=16" />

  <style>
    .centerArea{
      display:flex;
      justify-content:center;
      align-items:center;
      width: 100%;
      min-height: 62vh;
    }

    .stage{
      width: min(92vw, 520px);
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.35);
      position: relative;
      isolation: isolate;
      margin: 0 auto;
    }

    .stage video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: contain;
      background:#000;
      display:block;
    }

    .stage.hideVideo video{
      opacity: 0;
      transition: opacity 120ms ease;
    }

    .playOverlay{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      background: rgba(0,0,0,.55);
      z-index: 2;
      transition: opacity 200ms ease, transform 200ms ease;
      opacity: 1;
      transform: scale(1);
    }
    .playOverlay.off{
      opacity: 0;
      transform: scale(.985);
      pointer-events:none;
    }

    .playBig{
      width: min(86%, 360px);
      min-height: 54px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.10);
      color: rgba(255,255,255,.92);
      font-size: 15px;
      font-weight: 650;
      letter-spacing: .2px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .playBig:active{ transform: scale(.99); }

    .whiteout{
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 2147483646;
      transition: opacity 120ms ease;
    }
    .whiteout.on{
      opacity: 1;
      pointer-events: auto;
    }

    .fxCanvas{
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2147483647;
      pointer-events: none;
      opacity: 0;
      transition: opacity 180ms ease;
    }
    .fxCanvas.on{ opacity: 1; }

    .btnWide{
      width:100%;
      display:grid;
      place-items:center;
      text-decoration:none;
      color: rgba(255,255,255,.92);
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 16px;
      padding: 14px 10px;
      min-height: 48px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .btnWide:active{ transform: scale(.99); }

    .afterLayer{
      position: fixed;
      inset: 0;
      z-index: 2147483645;
      display: grid;
      place-items: center;
      padding: 18px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 240ms ease;
    }
    .afterLayer.on{
      opacity: 1;
      pointer-events: none;
    }

    .afterCard{
      width: min(92vw, 520px);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(10px);
      padding: 16px 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      max-height: 78vh;
      overflow: hidden;
    }

    .bigTitle{
      margin: 0;
      font-size: 22px;
      line-height: 1.12;
      letter-spacing: .3px;
      text-align: center;
      color: rgba(255,255,255,.95);
      text-shadow: 0 0 18px rgba(120,180,255,.20);
    }

    .bigTitle span.char{
      display: inline-block;
      will-change: transform, opacity, filter;
    }

    .bigTitle.popIn span.char{
      animation: popIn 420ms ease forwards;
      animation-delay: var(--d, 0ms);
      opacity: 0;
      transform: translateY(8px) scale(.98);
      filter: blur(2px);
    }

    @keyframes popIn{
      to{
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .bigTitle.dustOut span.char{
      animation: dustOut 950ms ease forwards;
      animation-delay: var(--d, 0ms);
    }
    @keyframes dustOut{
      to{
        opacity: 0;
        transform: translate3d(var(--tx, 14px), var(--ty, -10px), 0) rotate(var(--rot, 6deg));
        filter: blur(6px);
      }
    }

    .longMsg{
      display: none;
      margin-top: 12px;
      color: rgba(255,255,255,.90);
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      max-height: 52vh;
      overflow: auto;
      padding-right: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .longMsg.on{
      display: block;
      animation: fadeInUp 520ms ease both;
    }

    @keyframes fadeInUp{
      from{ opacity: 0; transform: translateY(10px); filter: blur(2px); }
      to{ opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    /* ====== HINT SWIPE (aparece a los 10s) ====== */
    .swipeHint{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2147483646;
      display: flex;
      justify-content: center;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease;
    }
    .swipeHint.on{
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .swipePill{
      width: min(92vw, 520px);
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 14px;
      color: rgba(255,255,255,.92);
      font-size: 13px;
    }
    .swipeArrow{
      display: inline-block;
      animation: bounceUp 1.1s ease-in-out infinite;
      opacity: .95;
    }
    @keyframes bounceUp{
      0%, 100% { transform: translateY(2px); }
      50% { transform: translateY(-4px); }
    }

    /* ====== CUPÓN (sheet) ====== */
    .couponSheet{
      position: fixed;
      inset: 0;
      z-index: 2147483646;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      pointer-events: none;
    }
    .couponSheet.on{
      pointer-events: auto;
    }
    .couponBackdrop{
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.55);
      opacity: 0;
      transition: opacity 220ms ease;
    }
    .couponSheet.on .couponBackdrop{
      opacity: 1;
    }
    .couponPanel{
      position: relative;
      width: min(92vw, 520px);
      margin: 0 0 14px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 70px rgba(0,0,0,.35);
      padding: 12px 12px 14px;
      transform: translateY(110%);
      transition: transform 280ms cubic-bezier(.2,.85,.2,1);
    }
    .couponSheet.on .couponPanel{
      transform: translateY(0);
    }
    .sheetHandle{
      width: 54px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255,255,255,.25);
      margin: 6px auto 10px;
    }

    /* Ticket visual (sin imagen) */
    .ticket{
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(20,60,120,.35);
      background:
        linear-gradient(135deg, rgba(70,165,255,.30), rgba(70,165,255,.18)),
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.18), transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,.10), transparent 55%);
      padding: 14px 12px;
      min-height: 160px;
      display: grid;
      place-items: center;
    }
    .ticketInner{
      width: 100%;
      display: grid;
      grid-template-columns: 60px 1fr 60px;
      align-items: center;
      gap: 10px;
    }
    .ticketSide{
      font-weight: 800;
      letter-spacing: 2px;
      opacity: .8;
      color: rgba(0,0,0,.55);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      text-align: center;
      user-select: none;
    }
    .ticketMain{
      text-align: center;
      padding: 8px 6px;
      border-radius: 14px;
      background: rgba(255,255,255,.22);
      border: 1px solid rgba(255,255,255,.25);
      color: rgba(0,0,0,.70);
    }
    .ticketTitle{
      font-size: 12px;
      letter-spacing: 1.6px;
      font-weight: 900;
      opacity: .85;
      text-transform: uppercase;
    }
    .ticketText{
      margin-top: 6px;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.15;
    }
    .ticketSmall{
      margin-top: 6px;
      font-size: 12px;
      font-weight: 700;
      opacity: .8;
    }
    /* “Mordidas” laterales */
    .ticket::before,
    .ticket::after{
      content:"";
      position: absolute;
      top: 50%;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,.08); /* igual al panel para simular corte */
    }
    .ticket::before{ left: -13px; }
    .ticket::after{ right: -13px; }

    .couponNote{
      margin: 10px 2px 0;
      color: rgba(255,255,255,.88);
      font-size: 13px;
      line-height: 1.35;
      text-align: center;
    }

    .couponActions{
      display:flex;
      gap:10px;
      margin-top: 12px;
    }
    .btnMini{
      flex: 1;
      min-height: 46px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.10);
      color: rgba(255,255,255,.92);
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btnMini:active{ transform: scale(.99); }
  </style>
</head>

<body>
  <div class="whiteout" id="whiteout" aria-hidden="true"></div>
  <canvas class="fxCanvas" id="fxCanvas" aria-hidden="true"></canvas>

  <div class="afterLayer" id="afterLayer" aria-hidden="true">
    <div class="afterCard">
      <h2 class="bigTitle" id="bigTitle"></h2>
      <div class="longMsg" id="longMsg"></div>
    </div>
  </div>

  <!-- Hint swipe -->
  <div class="swipeHint" id="swipeHint" aria-hidden="true">
    <div class="swipePill" id="swipePill">
      <span class="swipeArrow">⬆️</span>
      <span>Desliza hacia arriba cuando termines de leer por favor</span>
    </div>
  </div>

  <!-- Cupón -->
  <div class="couponSheet" id="couponSheet" aria-hidden="true">
    <div class="couponBackdrop" id="couponBackdrop"></div>

    <div class="couponPanel" role="dialog" aria-modal="true" aria-label="Cupón sorpresa">
      <div class="sheetHandle"></div>

      <div class="ticket" aria-label="Cupón">
        <div class="ticketInner">
          <div class="ticketSide">827830</div>

          <div class="ticketMain">
            <div class="ticketTitle">VALE PARA CANJEAR</div>
            <div class="ticketText">una comida juntos 🍽️</div>
            <div class="ticketSmall">*canjeable 1 vez*</div>
          </div>

          <div class="ticketSide">827830</div>
        </div>
      </div>

      <div class="couponNote">
        Válido para cualquier día, menos si estamos con familia.
      </div>

      <div class="couponActions">
        <button class="btnMini" id="closeCouponBtn" type="button">Cerrar</button>
      </div>
    </div>
  </div>

  <main class="phone" role="main">
    <header class="top">
      <h1> 🎊🎉FELIZ AÑO NUEVO NIÑA🍾🥂🍻</h1>
    </header>

    <section class="card">
      <div class="centerArea">
        <div class="stage" id="stage">
          <video
            id="scene"
            src="./assets/show1.mp4"
            playsinline
            webkit-playsinline
            preload="auto"
          ></video>

          <div class="playOverlay" id="playOverlay">
            <button class="playBig" id="playBig" type="button">▶️ Dale play por favor</button>
          </div>
        </div>
      </div>
    </section>

    <a class="btnWide" href="./index.html">← Volver</a>

    <footer class="footer">
      <small>Hecho con cariño.</small>
    </footer>
  </main>

  <script>
    // ====== CONFIG ======
    const START_AT      = 0;
    const WHITEOUT_MS   = 2000;
    const FIREWORKS_MS  = 4200;
    const END_GUARD     = 0.18;
    const BURST_EVERY   = 260;
    const BURST_COUNT   = 95;

    // ====== TIEMPOS DE LECTURA ======
    const TITLE_READ_MS = 6000;
    const DUST_MS       = 1050;

    // ====== SWIPE ======
    const SWIPE_HINT_DELAY_MS = 10000; // 10s después de mostrar el texto largo

    // ====== Textos ======
    const TITLE_TEXT =
`FELIZ AÑO NUEVO MI NIÑA 💙
CON ESA SONRISA HERMOSA ✨
Y CON BONITO GLÚTEO 🍑 JAJA`;

    const LONG_TEXT =
`Feliz Año Nuevo, mi niña 🎆💫
Otro año que cerramos lejos, pero al mismo tiempo más cerca que nunca. A veces la distancia pesa, pero cuando pienso en ti, en tu risa, en nuestras llamadas y en todo lo que hemos pasado, siento que vale totalmente la pena.
Quiero que este nuevo año tengas más momentos de paz, más risas sinceras y menos días pesados. Y también quiero más “nosotros”: más llamadas tontas, más mensajes bonitos… y sí, más recuerdos juntos como los que nos esperan en marzo.
No puedo prometerte un año perfecto, pero sí puedo prometerte que voy a seguir intentando cuidar de ti, apoyarte y hacerte sentir importante, porque lo eres.
Gracias por ser mi persona en este mundo tan raro, mi niña. Te quiero más de lo que estas letras pueden decir. 💙`;

    const scene = document.getElementById("scene");
    const stage = document.getElementById("stage");
    const playOverlay = document.getElementById("playOverlay");
    const playBig = document.getElementById("playBig");
    const whiteout = document.getElementById("whiteout");
    const canvas = document.getElementById("fxCanvas");

    const afterLayer = document.getElementById("afterLayer");
    const bigTitle = document.getElementById("bigTitle");
    const longMsg = document.getElementById("longMsg");

    const swipeHint = document.getElementById("swipeHint");
    const swipePill = document.getElementById("swipePill");

    const couponSheet = document.getElementById("couponSheet");
    const couponBackdrop = document.getElementById("couponBackdrop");
    const closeCouponBtn = document.getElementById("closeCouponBtn");

    let finaleStarted = false;
    let endWatchTimer = null;

    let swipeHintTimer = null;
    let couponOpened = false;

    // ====== Canvas setup ======
    const ctx = canvas.getContext("2d");
    let dpr = Math.max(1, Math.floor(window.devicePixelRatio || 1));

    function resizeCanvas(){
      dpr = Math.max(1, Math.floor(window.devicePixelRatio || 1));
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // ====== Fireworks ======
    const particles = [];
    function rand(min, max){ return Math.random() * (max - min) + min; }

    function burst(x, y){
      const count = BURST_COUNT;
      const hueBase = rand(0, 360);

      for(let i=0;i<count;i++){
        const a = rand(0, Math.PI * 2);
        const sp = rand(2.6, 8.4);
        const hue = (hueBase + rand(-45, 45) + 360) % 360;

        particles.push({
          x, y,
          vx: Math.cos(a)*sp,
          vy: Math.sin(a)*sp,
          life: rand(48, 86),
          r: rand(1.1, 2.8),
          c: `hsl(${Math.floor(hue)} 95% 62%)`,
          tw: rand(0.25, 0.75)
        });
      }

      for(let k=0;k<14;k++){
        particles.push({
          x: x + rand(-20, 20),
          y: y + rand(-20, 20),
          vx: rand(-1.2, 1.2),
          vy: rand(-1.8, 0.2),
          life: rand(22, 36),
          r: rand(0.8, 1.6),
          c: `rgba(255,255,255,.85)`,
          tw: rand(0.2, 0.9)
        });
      }
    }

    let fxStart = 0;
    let lastBurst = 0;

    function fxLoop(ts){
      if(!fxStart) fxStart = ts;
      const t = ts - fxStart;

      ctx.clearRect(0,0,window.innerWidth, window.innerHeight);

      if(ts - lastBurst > BURST_EVERY){
        lastBurst = ts;
        burst(rand(70, window.innerWidth-70), rand(110, window.innerHeight*0.55));
        if(Math.random() < 0.45){
          burst(rand(70, window.innerWidth-70), rand(110, window.innerHeight*0.55));
        }
      }

      for(let i=particles.length-1; i>=0; i--){
        const p = particles[i];
        p.vy += 0.055;
        p.vx *= 0.99;
        p.vy *= 0.99;

        const px = p.x, py = p.y;

        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;

        const alpha = Math.max(0, Math.min(1, p.life/90));
        const twinkle = 0.6 + 0.4 * Math.sin((90 - p.life) * p.tw);

        ctx.globalAlpha = alpha * 0.25;
        ctx.strokeStyle = p.c;
        ctx.lineWidth = Math.max(1, p.r);
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();

        ctx.globalAlpha = alpha * twinkle;
        ctx.fillStyle = p.c;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fill();

        if(p.life <= 0) particles.splice(i,1);
      }
      ctx.globalAlpha = 1;

      if(t < FIREWORKS_MS){
        requestAnimationFrame(fxLoop);
      }else{
        stopFireworks();
        showTextsSequence();
      }
    }

    function startFireworks(){
      canvas.classList.add("on");
      fxStart = 0;
      lastBurst = 0;
      particles.length = 0;
      requestAnimationFrame(fxLoop);
    }

    function stopFireworks(){
      canvas.classList.remove("on");
      ctx.clearRect(0,0,window.innerWidth, window.innerHeight);
      particles.length = 0;
    }

    // ====== Text sequence ======
    function buildTitleSpans(text){
      bigTitle.innerHTML = "";
      const lines = text.split("\n");

      lines.forEach((line, lineIdx) => {
        const lineWrap = document.createElement("div");
        lineWrap.style.display = "block";

        const chars = Array.from(line);
        chars.forEach((ch, i) => {
          const s = document.createElement("span");
          s.className = "char";
          s.textContent = ch === " " ? "\u00A0" : ch;

          const delay = (lineIdx * 140) + (i * 18);
          s.style.setProperty("--d", `${delay}ms`);

          s.style.setProperty("--tx", `${Math.floor(rand(-22, 26))}px`);
          s.style.setProperty("--ty", `${Math.floor(rand(-18, 14))}px`);
          s.style.setProperty("--rot", `${Math.floor(rand(-10, 12))}deg`);

          lineWrap.appendChild(s);
        });

        bigTitle.appendChild(lineWrap);
      });
    }

    function hideSwipeHint(){
      swipeHint?.classList.remove("on");
      swipeHint?.setAttribute("aria-hidden", "true");
      if(swipeHintTimer){
        clearTimeout(swipeHintTimer);
        swipeHintTimer = null;
      }
    }

    function scheduleSwipeHint(){
      hideSwipeHint();
      couponOpened = false;

      swipeHintTimer = setTimeout(() => {
        if(couponOpened) return;
        swipeHint.classList.add("on");
        swipeHint.setAttribute("aria-hidden", "false");
      }, SWIPE_HINT_DELAY_MS);
    }

    function openCoupon(){
      couponOpened = true;
      hideSwipeHint();
      couponSheet.classList.add("on");
      couponSheet.setAttribute("aria-hidden", "false");
    }

    function closeCoupon(){
      couponSheet.classList.remove("on");
      couponSheet.setAttribute("aria-hidden", "true");
    }

    async function showTextsSequence(){
      afterLayer.classList.add("on");
      afterLayer.setAttribute("aria-hidden", "false");

      buildTitleSpans(TITLE_TEXT);
      bigTitle.classList.remove("dustOut");
      bigTitle.classList.add("popIn");

      await new Promise(r => setTimeout(r, TITLE_READ_MS));

      bigTitle.classList.remove("popIn");
      bigTitle.classList.add("dustOut");

      await new Promise(r => setTimeout(r, DUST_MS));

      bigTitle.style.display = "none";
      longMsg.textContent = LONG_TEXT;
      longMsg.classList.add("on");

      // <<<<< aquí empieza la lógica del swipe a los 10s
      scheduleSwipeHint();
    }

    function resetUI(){
      stopFireworks();
      hideSwipeHint();
      closeCoupon();

      whiteout.classList.remove("on");
      finaleStarted = false;

      if(endWatchTimer){
        clearInterval(endWatchTimer);
        endWatchTimer = null;
      }

      stage.classList.remove("hideVideo");

      afterLayer.classList.remove("on");
      afterLayer.setAttribute("aria-hidden", "true");
      bigTitle.style.display = "";
      bigTitle.className = "bigTitle";
      bigTitle.innerHTML = "";
      longMsg.className = "longMsg";
      longMsg.textContent = "";
    }

    async function startFinale(){
      if(finaleStarted) return;
      finaleStarted = true;

      if(endWatchTimer){
        clearInterval(endWatchTimer);
        endWatchTimer = null;
      }

      stage.classList.add("hideVideo");

      try{ scene.pause(); }catch(_){}

      whiteout.classList.add("on");
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      await new Promise(r => setTimeout(r, WHITEOUT_MS));
      whiteout.classList.remove("on");

      startFireworks();
    }

    function startEndWatcher(){
      if(endWatchTimer) clearInterval(endWatchTimer);

      endWatchTimer = setInterval(() => {
        if(finaleStarted) return;

        if(scene.ended) {
          startFinale();
          return;
        }

        const dur = scene.duration;
        if(Number.isFinite(dur) && dur > 0){
          if(scene.currentTime >= dur - END_GUARD){
            startFinale();
          }
        }
      }, 140);
    }

    function startShow(){
      resetUI();

      try{ scene.currentTime = START_AT; }catch(_){}

      scene.muted = false;

      const p = scene.play();
      if (p && typeof p.then === "function") {
        p.then(() => {
          playOverlay.classList.add("off");
          startEndWatcher();
        }).catch(() => {
          scene.muted = true;
          const p2 = scene.play();
          if (p2 && typeof p2.then === "function") {
            p2.then(() => {
              playOverlay.classList.add("off");
              startEndWatcher();
            }).catch((e2) => {
              console.log("No se pudo reproducir ni muted:", e2);
            });
          }
        });
      } else {
        playOverlay.classList.add("off");
        startEndWatcher();
      }
    }

    // ====== Events video ======
    scene.addEventListener("ended", () => startFinale());

    scene.addEventListener("webkitendfullscreen", () => {
      const dur = scene.duration;
      if(!finaleStarted && Number.isFinite(dur) && scene.currentTime >= dur - 0.25){
        startFinale();
      }
    });

    scene.addEventListener("error", () => {
      console.log("No se pudo cargar el video: ./assets/show1.mp4");
    });

    // ====== Play button ======
    playBig.addEventListener("pointerdown", (e) => { e.preventDefault(); startShow(); }, { passive: false });
    playBig.addEventListener("touchend", (e) => { e.preventDefault(); startShow(); }, { passive: false });
    playBig.addEventListener("click", () => startShow());

    // ====== Swipe detection SOLO en el hint ======
    let startY = null;

    function onTouchStart(e){
      if(!e.touches || !e.touches[0]) return;
      startY = e.touches[0].clientY;
    }
    function onTouchEnd(e){
      if(startY == null) return;
      const endY = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientY : startY;
      const dy = startY - endY; // swipe up => dy positivo
      startY = null;
      if(dy > 45){
        openCoupon();
      }
    }

    swipePill.addEventListener("touchstart", onTouchStart, { passive: true });
    swipePill.addEventListener("touchend", onTouchEnd, { passive: true });

    // desktop / iOS pointer fallback
    let pStartY = null;
    swipePill.addEventListener("pointerdown", (e) => { pStartY = e.clientY; }, { passive: true });
    swipePill.addEventListener("pointerup", (e) => {
      if(pStartY == null) return;
      const dy = pStartY - e.clientY;
      pStartY = null;
      if(dy > 45) openCoupon();
    }, { passive: true });

    // si alguien toca el hint (sin swipe), también abrimos (fallback)
    swipePill.addEventListener("click", () => openCoupon());

    // ====== Close coupon ======
    couponBackdrop.addEventListener("click", () => closeCoupon());
    closeCouponBtn.addEventListener("click", () => closeCoupon());

    window.addEventListener("pageshow", (e) => {
      if (e.persisted) resetUI();
    });

    window.addEventListener("DOMContentLoaded", () => {
      try{ scene.load(); }catch(_){}
    });
  </script>
</body>
</html>
